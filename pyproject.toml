[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tushar-2320", email = "tk1444272@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
rag-pipeline = "rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]
